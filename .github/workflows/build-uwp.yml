name: Build Tenkaichi Decomp Xbox UWP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدويًا

jobs:
  build:
    runs-on: windows-latest

    env:
      SolutionPath: port/src/Tenkaichi3Decomp.sln # تأكد من مسار ملف الـ Solution الصحيح لمشروع الـ UWP
      Configuration: Release
      Platform: x64

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # لتنزيل كافة المكتبات الفرعية إن وجدت

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore \${{ env.SolutionPath }}

    - name: Build UWP App Package
      run: |
        msbuild \${{ env.SolutionPath }} `
          /p:Configuration=\${{ env.Configuration }} `
          /p:Platform=${{ env.Platform }} `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x64" `
          /p:AppxPackageDir="\${{ github.workspace }}\AppxPackages\\" `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxPackageSigningEnabled=false

    - name: Upload UWP Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Tenkaichi-Decomp-Xbox-UWP
        path: \${{ github.workspace }}\AppxPackages\
