name: Build Xbox UWP (No Visual Studio / No NuGet)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً

jobs:
  build-uwp:
    runs-on: windows-latest # استخدام بيئة ويندوز جاهزة تحتوي على أدوات MSBuild و Windows SDK

    steps:
    # 1. جلب الكود المصدري للمشروع
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # جلب المكتبات الفرعية تلقائياً إن وجدت

    # 2. إعداد أدوات MSBuild (تغنيك عن تثبيت Visual Studio بالكامل)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. تهيئة بيئة بناء UWP (اختياري: لتحديد إصدار كرت الشاشة والـ SDK المدمج)
    - name: Configure CMake / Python Pre-build (If needed by the port)
      run: |
        python configure.py
      shell: pwsh

    # 4. بناء المشروع مباشرة بصيغة UWP (Appx / Msix) بدون استدعاء استعادة NuGet التقليدية
    # نقوم بتمرير الـ Targets والـ Configuration المطلوبة للاكس بوكس
    - name: Build UWP Project using MSBuild
      run: |
        msbuild port/src/platform/uwp/YourProject.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x64" `
          /p:BuildAppxUploadPackage=false `
          /p:ResolveNugetPackages=false
      shell: pwsh
      # تنويه: استبدل "port/src/platform/uwp/YourProject.sln" بالمسار الصحيح لملف الحل (Solution) الخاص بـ UWP داخل مشروع التفكيك.

    # 5. رفع ملف الـ Appx/Msix الناتج كـ Artifact لتحميله وتشغيله على Xbox Dev Mode
    - name: Upload Xbox UWP Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tenkaichi-Decomp-Xbox-UWP
        path: |
          **/AppPackages/**/*


