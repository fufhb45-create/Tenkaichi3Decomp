
name: Build Xbox UWP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # جلب المكتبات الفرعية تلقائياً إن وجدت بديلًا لـ NuGet

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build UWP App (Xbox)
      run: |
        msbuild TenkaichiDecomp.sln /p:Configuration=Release /p:Platform="x64" /p:AppxBundle=Always /p:AppxBundlePlatforms="x64" /p:UapAppxPackageBuildMode=StoreUpload /p:HasPackageAndPublishMenu=true

